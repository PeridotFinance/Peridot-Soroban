[package]
name = "margin-fork"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated, test-only: protocol-30 host (soroban-env-host 30.0.1; Mainnet runs protocol 30 since 23 Nov 2026) over a read-only Mainnet ledger fork.
# Loads the deployed WASM bytes from the fork's ContractCode entries; never compiles contract WASM.
[workspace]

[dependencies]
soroban-sdk = { version = "=30.0.0", features = ["testutils"] }
soroban-env-host = { version = "=30.0.1", features = ["testutils"] }
soroban-ledger-snapshot = "=30.0.0"
serde_json = "1"
sha2 = "0.10"
stellar-strkey = "=1.0.0"

[profile.dev]
overflow-checks = true
