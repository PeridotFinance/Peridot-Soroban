[package]
name = "simple-peridottroller"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated from the production workspace. Prototype copy for the CL collateral group.
[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
test-default-admin = []
lp-zero-peri = []
# Patch switch: OFF reproduces the generic controller source exactly.
group = []
# Test-only v2-prime marker build (upgrade state-survival test). Never a release feature.
upgrade-marker = []

[dependencies]
soroban-sdk = { version = "25.3.0", features = ["experimental_spec_shaking_v2"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
