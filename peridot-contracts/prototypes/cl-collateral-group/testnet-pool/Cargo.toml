[package]
name = "cl-group-testnet-pool"
version = "0.1.0"
edition = "2021"
publish = false

# TESTNET-ONLY concentrated-pool fixture (copy of the vault-v2 mock pool + settable slot0 price).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=25.3.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
