[package]
name = "cl-group-testnet-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# TESTNET-ONLY Reflector-ABI price fixture for the CL group rehearsal. Refuses Mainnet.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=25.3.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
