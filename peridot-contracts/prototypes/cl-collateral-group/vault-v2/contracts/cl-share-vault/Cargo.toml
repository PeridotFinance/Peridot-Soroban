[package]
name = "cl-share-vault"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["lib", "cdylib"]
[features]
# Isolated Mainnet acceptance; never present in the production manifest.
cl-pyusd-vault-b = []
hybrid-rewards = []
hybrid-validation = []
test-default-admin = []
# Test-only v2-prime marker build for the upgrade state-survival test. Never a release feature.
upgrade-marker = []
[dependencies]
soroban-sdk = { workspace = true }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-aquarius-pool = { path = "../mocks/mock-aquarius-pool" }
mock-token = { path = "../mocks/mock-token" }
