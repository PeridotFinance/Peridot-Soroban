[package]
name = "simple-peridottroller"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Native test fixture support only; contract code rejects this feature for Wasm builds.
test-default-admin = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
receipt-vault = { path = "../receipt-vault", features = ["test-default-admin"] }
peridot-token = { path = "../peridot-token", features = ["test-default-admin"] }
