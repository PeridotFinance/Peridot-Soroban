[package]
name = "margin-controller"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Preserve the reviewed native prototype; standalone WASM builds are rejected.
funded-liquidation-prototype = []
# Explicit local WASM integration only; initialization and every funded entrypoint
# reject the Public-network ID. This is not a production release feature.
funded-liquidation-validation = ["funded-liquidation-prototype"]

[dependencies]
soroban-sdk = { workspace = true }
receipt-vault = { path = "../receipt-vault" }
simple-peridottroller = { path = "../simple-peridottroller" }
swap-adapter = { path = "../swap-adapter" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-token = { path = "../mocks/mock-token" }
receipt-vault = { path = "../receipt-vault", features = ["test-default-admin"] }
simple-peridottroller = { path = "../simple-peridottroller", features = ["test-default-admin"] }
swap-adapter = { path = "../swap-adapter", features = ["test-default-admin"] }
